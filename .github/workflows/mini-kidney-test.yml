name: Mini kidney test

# Runs the whole workflow on one small dataset (Lake 2023 kidney, 3514 cells) taken from the
# output of cellxgene-harvester-nf: its CSV and JSON, the resolve files and its filtered h5ad.
on:
  workflow_dispatch:
    inputs:
      data_repo:
        description: Repository holding the cellxgene-harvester-nf test output
        default: NIH-NLM/nlm-ckn
      data_ref:
        description: 'Branch or tag of that repository. Default main (merged results). To test an unmerged harvester run, type its branch name here'
        default: main
      author_cell_type:
        description: obs column of the cluster labels, used only where the CSV leaves it empty
        default: subclass.full
      embedding:
        description: embedding key, used only where the CSV leaves it empty
        default: X_umap
      publish:
        description: 'Also publish the results (with the final filtered h5ad) to a new branch of NIH-NLM/nlm-ckn (data/test/kidney/sc-nsforest-qc-nf). Needs the secret NLM_CKN_TOKEN'
        type: boolean
        default: false
      n_trees:
        description: NSForest trees (fewer is faster)
        default: '100'

permissions:
  contents: read

jobs:
  mini-kidney:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RAW: https://raw.githubusercontent.com/${{ inputs.data_repo }}/${{ inputs.data_ref }}/data/test/kidney
      ID: 0b75c598-0893-4216-afe8-5414cab7739d
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Fetch the harvester output
        run: |
          mkdir -p testdata/h5ad
          H=$RAW/cellxgene-harvester-nf
          O=${RAW%/kidney}/ontology_lookup_server
          curl -fL $H/homo_sapiens_kidney_harvester_final.csv  -o testdata/final.csv
          curl -fL $H/homo_sapiens_kidney_harvester_final.json -o testdata/final.json
          curl -fL $H/uberon_kidney.json -o testdata/uberon_kidney.json
          for f in disease_normal hsapdv_adult_15 assay_published; do
            curl -fL $O/$f.json -o testdata/$f.json
          done
          curl -fL $RAW/filtered-h5ad/$ID.filtered.h5ad -o testdata/h5ad/$ID.filtered.h5ad
          ls -lh testdata testdata/*

      - name: Fill author_cell_type and embedding where the CSV leaves them empty
        # the curator fills these two columns in the CSV; for this test dataset (Lake 2023) the
        # values are the workflow inputs (default subclass.full and X_umap)
        run: |
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open('testdata/final.csv')))
          for r in rows:
              for col, default in (('author_cell_type', '${{ inputs.author_cell_type }}'), ('embedding', '${{ inputs.embedding }}')):
                  if r[col].strip():
                      print(col, 'from the CSV:', r[col])
                  else:
                      r[col] = default
                      print(col, 'empty in the CSV, using the default:', default)
          with open('testdata/curated.csv', 'w', newline='') as f:
              w = csv.DictWriter(f, fieldnames=rows[0].keys())
              w.writeheader()
              w.writerows(rows)
          PY

      - name: Run the workflow
        env:
          TOKEN: ${{ secrets.NLM_CKN_TOKEN }}
        run: |
          PUBLISH=""
          if [ "${{ inputs.publish }}" = "true" ]; then
            if [ -z "$TOKEN" ]; then echo "ERROR: publish is ticked but the secret NLM_CKN_TOKEN is not set (Settings > Secrets and variables > Actions)" >&2; exit 1; fi
            PUBLISH="--github_token $TOKEN --publish_repo NIH-NLM/nlm-ckn --publish_dest_dir data/test/kidney/sc-nsforest-qc-nf/results/kidney-Lake-Nature-2023-4af23f"
          fi
          nextflow run main.nf \
            -profile ci \
            --organ kidney \
            --uberon_json testdata/uberon_kidney.json \
            --disease_json testdata/disease_normal.json \
            --hsapdv_json testdata/hsapdv_adult_15.json \
            --h5ad_dir testdata/h5ad \
            --harvester_csv testdata/curated.csv \
            --harvester_json testdata/final.json \
            --assay_json testdata/assay_published.json \
            --n_trees ${{ inputs.n_trees }} \
            $PUBLISH \
            --outdir results

      - name: Check the outputs
        run: |
          ls -lh results
          test -n "$(ls results/*adata_filtered*.h5ad 2>/dev/null)"
          test -n "$(ls results/*.csv 2>/dev/null)"
          test -n "$(ls results/sc_nsforest_qc_*.json 2>/dev/null)"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-kidney-results
          path: |
            results/
            .nextflow.log
          if-no-files-found: warn
