name: Build and Publish Docker image to GHCR

on:
  push:
    branches: [ "main" ]  # Only on main branch pushes
  workflow_dispatch:      # also manual (Actions tab > Run workflow), to try a gene table that is not merged yet
    inputs:
      gene_mapping_ref:
        description: 'Branch or tag of nlm-ckn that holds data/prod/gencode. main = the image :latest; any other value builds only the image :gene-mapping-<that name>'
        default: main

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set lowercase image name using posix compliant tr
        id: image
        run: echo "IMAGE_NAME=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Choose the tags
        id: tags
        env:
          GENE_MAPPING_REF: ${{ inputs.gene_mapping_ref || 'main' }}
        run: |
          base="${REGISTRY}/${IMAGE_NAME}/nsforest"
          if [ "$GENE_MAPPING_REF" = "main" ]; then
            echo "list=${base}:latest,${base}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            # a table that is not on main: the image :latest is not replaced
            safe=$(echo "$GENE_MAPPING_REF" | tr -c 'A-Za-z0-9._-' '-')
            echo "list=${base}:gene-mapping-${safe}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./container/nsforest/
          push: true
          no-cache: true
          build-args: |
            GENE_MAPPING_REF=${{ inputs.gene_mapping_ref || 'main' }}
          tags: ${{ steps.tags.outputs.list }}
